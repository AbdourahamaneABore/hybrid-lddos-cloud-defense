global
    maxconn 50000          # Augmente drastiquement la capacité pour encaisser le DoS

defaults
    mode http
    timeout connect 10s
    timeout client  300s   # Donne le temps à l'attaquant de rester connecté
    timeout server  300s
    timeout http-request 300s # TRÈS IMPORTANT : Empêche HAProxy de couper les headers lents

frontend http_in
    bind 10.10.0.100:80
    default_backend web_servers

backend web_servers
    balance roundrobin
    server srv1 10.10.0.201:80 check
    server srv2 10.10.0.202:80 check
    server srv3 10.10.0.203:80 check
    server srv4 10.10.0.204:80 check
    server srv5 10.10.0.205:80 check
    server srv6 10.10.0.206:80 check
    server srv7 10.10.0.207:80 check
    server srv8 10.10.0.208:80 check
    server srv9 10.10.0.209:80 check
    server srv10 10.10.0.210:80 check
